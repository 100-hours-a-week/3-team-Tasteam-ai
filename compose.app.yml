services:
  retrieval-service:
    build:
      context: .
      dockerfile: Dockerfile.retrieval-service
    container_name: tasteam-retrieval-service
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      PORT: "8010"
      HF_HOME: /app/models
      EMBEDDING_CACHE_DIR: /app/models
      QDRANT_URL: /app/qdrant_data
      USE_RETRIEVAL_SERVICE: "false"
    volumes:
      - model-cache:/app/models
      - qdrant-data:/app/qdrant_data
    restart: unless-stopped
    networks:
      - tasteam-net

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: tasteam-app
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      PORT: "8001"
      USE_RETRIEVAL_SERVICE: "true"
      RETRIEVAL_SERVICE_URL: "http://retrieval-service:8010"
      HF_HOME: /app/models
      EMBEDDING_CACHE_DIR: /app/models
      QDRANT_URL: /app/qdrant_data
      # Distill Pod route (runtime toggle via Makefile/environment)
      DISTILL_POD_ROUTE_ENABLED: "${DISTILL_POD_ROUTE_ENABLED:-false}"
      DISTILL_POD_AUTO_CREATE: "${DISTILL_POD_AUTO_CREATE:-false}"
      DISTILL_POD_BASE_URL: "${DISTILL_POD_BASE_URL:-}"
      DISTILL_POD_MODEL: "${DISTILL_POD_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}"
      DISTILL_POD_COOLDOWN_SECONDS: "${DISTILL_POD_COOLDOWN_SECONDS:-180}"
      DISTILL_POD_CREATE_TIMEOUT_SECONDS: "${DISTILL_POD_CREATE_TIMEOUT_SECONDS:-600}"
      DISTILL_POD_HEALTHCHECK_TIMEOUT_SECONDS: "${DISTILL_POD_HEALTHCHECK_TIMEOUT_SECONDS:-10}"
      DISTILL_POD_INFERENCE_TIMEOUT_SECONDS: "${DISTILL_POD_INFERENCE_TIMEOUT_SECONDS:-60}"
      DISTILL_POD_DELETE_ON_FAILURE: "${DISTILL_POD_DELETE_ON_FAILURE:-true}"
      DISTILL_POD_PROXY_PORT: "${DISTILL_POD_PROXY_PORT:-8000}"
      DISTILL_POD_NAME: "${DISTILL_POD_NAME:-distill-vllm-pod}"
      DISTILL_POD_IMAGE_NAME: "${DISTILL_POD_IMAGE_NAME:-}"
      DISTILL_POD_NETWORK_VOLUME_ID: "${DISTILL_POD_NETWORK_VOLUME_ID:-}"
      DISTILL_POD_GPU_TYPE_ID: "${DISTILL_POD_GPU_TYPE_ID:-NVIDIA GeForce RTX 4090}"
    volumes:
      - model-cache:/app/models
      - qdrant-data:/app/qdrant_data
    depends_on:
      - retrieval-service
    restart: unless-stopped
    networks:
      - tasteam-net

volumes:
  model-cache:
    name: tasteam_model-cache
  qdrant-data:
    name: tasteam_qdrant-data

networks:
  tasteam-net:
    name: tasteam_tasteam-net
